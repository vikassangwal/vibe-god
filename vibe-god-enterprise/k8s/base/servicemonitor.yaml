apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vibe-god-api
  namespace: vibe-god-monitoring
  labels:
    app.kubernetes.io/name: vibe-god
    app.kubernetes.io/component: api
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vibe-god
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: http
      tlsConfig:
        insecureSkipVerify: true
    - port: http
      path: /health
      interval: 60s
      scheme: http
  namespaceSelector:
    matchNames:
      - vibe-god
---
