apiVersion: v1
kind: Secret
metadata:
  name: vibe-god-secrets
  namespace: vibe-god
  labels:
    app.kubernetes.io/name: vibe-god
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database
  database-url: "postgresql+asyncpg://postgres:changeme@postgresql.vibe-god:5432/vibe_god"
  database-password: "changeme"

  # Redis
  redis-url: "redis://:changeme@redis-master.vibe-god:6379/0"
  redis-password: "changeme"

  # RabbitMQ
  rabbitmq-url: "amqp://guest:changeme@rabbitmq.vibe-god:5672/"
  rabbitmq-user: "guest"
  rabbitmq-password: "changeme"
  rabbitmq-erlang-cookie: "changeme"

  # Kafka
  kafka-servers: "kafka-0.kafka.vibe-god:9092,kafka-1.kafka.vibe-god:9092,kafka-2.kafka.vibe-god:9092"

  # JWT/OIDC
  jwt-secret: "changeme-generate-secure-random"
  jwt-algorithm: "RS256"
  oidc-jwks-url: ""

  # External APIs
  sentry-dsn: ""
  aws-access-key: ""
  aws-secret-key: ""
  github-token: ""

  # Monitoring
  grafana-admin-password: "changeme"
  alertmanager-email-password: ""

  # Encryption
  encryption-key: "changeme-32-byte-base64-key=="
  sops-age-key: "age1changeme"

  # Feature flags
  feature-flags: "{}"
---
apiVersion: v1
kind: Secret
metadata:
  name: vibe-god-tls
  namespace: vibe-god
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: vibe-god-registry
  namespace: vibe-god
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""