# Default values for vibe-god Helm chart

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  environment: production
  logLevel: INFO
  logFormat: json
  otlpEndpoint: http://jaeger:4317

# Main API deployment
api:
  enabled: true
  replicaCount: 3
  image:
    repository: vibe-god/api
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
        selectPolicy: Max

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: "/metrics"

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    hosts:
      - host: api.vibe-god.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vibe-god-api-tls
        hosts:
          - api.vibe-god.example.com

  env:
    - name: ENVIRONMENT
      value: production
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: database-url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: redis-url
    - name: RABBITMQ_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: rabbitmq-url
    - name: KAFKA_BOOTSTRAP_SERVERS
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: kafka-servers
    - name: OLLAMA_URL
      value: http://ollama:11434
    - name: LOG_LEVEL
      value: INFO
    - name: OTLP_ENDPOINT
      value: http://jaeger:4317

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health/startup
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

  podLabels:
    app.kubernetes.io/component: api

  # Pod disruption budget
  pdb:
    enabled: true
    minAvailable: 2

  # Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: vibe-god
          app.kubernetes.io/component: api

# Worker deployment
worker:
  enabled: true
  replicaCount: 2
  image:
    repository: vibe-god/worker
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

  env:
    - name: ENVIRONMENT
      value: production
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: database-url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: redis-url
    - name: RABBITMQ_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: rabbitmq-url
    - name: WORKER_CONCURRENCY
      value: "8"

# Scheduler deployment (singleton)
scheduler:
  enabled: true
  replicaCount: 1
  image:
    repository: vibe-god/scheduler
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    - name: ENVIRONMENT
      value: production
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: database-url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: vibe-god-secrets
          key: redis-url

# Ollama LLM service
ollama:
  enabled: true
  replicaCount: 1
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 8000m
      memory: 16Gi
    requests:
      cpu: 4000m
      memory: 8Gi

  # GPU support (uncomment if available)
  # gpu:
  #   enabled: true
  #   resourceName: nvidia.com/gpu
  #   count: 1

  persistence:
    enabled: true
    size: 50Gi
    storageClass: fast-ssd

  env:
    - name: OLLAMA_HOST
      value: "0.0.0.0"
    - name: OLLAMA_NUM_PARALLEL
      value: "4"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "2"

  # Model preloading
  initContainers:
    - name: pull-models
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          sleep 10
          curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3:8b"}'
          curl -X POST http://localhost:11434/api/pull -d '{"name": "qwen2:7b"}'

# PostgreSQL database
postgresql:
  enabled: true
  primary:
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    persistence:
      size: 100Gi
      storageClass: fast-ssd
    pgpool:
      enabled: true
      replicas: 2

  readReplicas:
    enabled: true
    replicas: 2
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

  # Backup configuration
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retention: 30d
    storage:
      s3:
        bucket: vibe-god-backups
        region: us-east-1

# Redis cache
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
  master:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    persistence:
      size: 10Gi
  replica:
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# RabbitMQ message broker
rabbitmq:
  enabled: true
  replicaCount: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 20Gi
  metrics:
    enabled: true
  clusterFormation: k8s

# Kafka message broker
kafka:
  enabled: true
  replicas: 3
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  persistence:
    size: 50Gi
  zookeeper:
    replicas: 3
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

# Monitoring stack
monitoring:
  enabled: true

  prometheus:
    enabled: true
    retention: 30d
    storageSize: 50Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi

  grafana:
    enabled: true
    adminPassword: admin
    persistence:
      size: 10Gi
    dashboards:
      default:
        vibe-god-overview:
          json: |
            {
              "dashboard": {
                "title": "Vibe-God Overview",
                "panels": []
              }
            }

  alertmanager:
    enabled: true
    config:
      route:
        group_by: ['alertname']
        group_wait: 10s
        group_interval: 10m
        repeat_interval: 1h
        receiver: 'default'
      receivers:
        - name: 'default'
          email_configs:
            - to: 'alerts@vibe-god.io'
              from: 'alertmanager@vibe-god.io'
              smarthost: 'smtp.gmail.com:587'
              auth_username: 'alertmanager@vibe-god.io'
              auth_password: '${ALERTMANAGER_EMAIL_PASSWORD}'

  jaeger:
    enabled: true
    collector:
      replicas: 2
    query:
      replicas: 2

# Security policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

podSecurityPolicy:
  enabled: true

# Service mesh (Istio)
istio:
  enabled: false
  mtls: STRICT

# External secrets
externalSecrets:
  enabled: false
  provider: aws-secretsmanager

# ArgoCD application
argocd:
  enabled: false
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true