# Production values for vibe-god Helm chart

global:
  environment: production
  logLevel: INFO
  logFormat: json
  otlpEndpoint: http://jaeger-collector.observability:4317

api:
  replicaCount: 5
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
  pdb:
    minAvailable: 3

worker:
  replicaCount: 4
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    minReplicas: 4
    maxReplicas: 20
    targetCPUUtilizationPercentage: 50

scheduler:
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

ollama:
  replicaCount: 2
  resources:
    limits:
      cpu: 16000m
      memory: 32Gi
    requests:
      cpu: 8000m
      memory: 16Gi
  persistence:
    size: 100Gi

postgresql:
  primary:
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 2000m
        memory: 4Gi
    persistence:
      size: 500Gi
  readReplicas:
    replicas: 4
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi

redis:
  master:
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 1Gi
    persistence:
      size: 50Gi
  replica:
    replicaCount: 4

rabbitmq:
  replicaCount: 5
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  persistence:
    size: 100Gi

kafka:
  replicas: 6
  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 2000m
      memory: 2Gi
  persistence:
    size: 200Gi

monitoring:
  prometheus:
    retention: 90d
    storageSize: 200Gi
  grafana:
    persistence:
      size: 50Gi

networkPolicy:
  enabled: true

podSecurityPolicy:
  enabled: true

istio:
  enabled: true
  mtls: STRICT

externalSecrets:
  enabled: true
  provider: aws-secretsmanager