version: '3.8'

services:
  # Main API service (production)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vibe-god/api:${VERSION:-latest}
    container_name: vibe-god-api
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - OLLAMA_URL=${OLLAMA_URL}
      - LOG_LEVEL=INFO
      - OTLP_ENDPOINT=${OTLP_ENDPOINT}
      - SENTRY_DSN=${SENTRY_DSN}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/vibe-god/config:/app/config:ro
      - vibe-god-data:/app/data
      - vibe-god-logs:/app/logs
    networks:
      - vibe-god-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

  # Worker service (production)
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vibe-god/worker:${VERSION:-latest}
    container_name: vibe-god-worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - OLLAMA_URL=${OLLAMA_URL}
      - LOG_LEVEL=INFO
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/vibe-god/config:/app/config:ro
      - vibe-god-data:/app/data
      - vibe-god-logs:/app/logs
    networks:
      - vibe-god-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure

  # Scheduler service (production - single replica)
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vibe-god/scheduler:${VERSION:-latest}
    container_name: vibe-god-scheduler
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/vibe-god/config:/app/config:ro
      - vibe-god-data:/app/data
      - vibe-god-logs:/app/logs
    networks:
      - vibe-god-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure

  # PostgreSQL with replication (production)
  postgres:
    image: postgres:16-alpine
    container_name: vibe-god-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vibe_god}
      - POSTGRES_REPLICATION_USER=${POSTGRES_REPLICATION_USER:-replicator}
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # PostgreSQL read replica
  postgres-replica:
    image: postgres:16-alpine
    container_name: vibe-god-postgres-replica
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vibe_god}
      - POSTGRES_MASTER_HOST=postgres
      - POSTGRES_REPLICATION_USER=${POSTGRES_REPLICATION_USER:-replicator}
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    command: >
      postgres
      -c hot_standby=on
      -c max_replication_slots=5
      -c max_wal_senders=5
      -c wal_level=replica
      -c hot_standby_feedback=on
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      - postgres
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Redis Cluster (production)
  redis:
    image: redis:7-alpine
    container_name: vibe-god-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # RabbitMQ Cluster (production)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vibe-god-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Kafka Cluster (production)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vibe-god-kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_NUM_PARTITIONS=6
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vibe-god-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
      - ZOOKEEPER_SYNC_LIMIT=2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - vibe-god-network

  # Ollama (production - GPU recommended)
  ollama:
    image: ollama/ollama:latest
    container_name: vibe-god-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
      # GPU support
      # reservations:
      #   devices:
      #     - driver: nvidia
      #       count: 1
      #       capabilities: [gpu]

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vibe-god-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - vibe-god-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  vibe-god-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  ollama_data:
  vibe-god-data:
  vibe-god-logs: