[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-god"
version = "1.0.0"
description = "Enterprise-grade AI automation platform for Digital India"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vibe-God Team", email = "team@vibe-god.io"}
]
maintainers = [
    {name = "Platform Team", email = "platform@vibe-god.io"}
]
keywords = [
    "automation", "ai", "emitra", "twitter", "digital-india",
    "e-governance", "social-media", "document-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",

    # Async
    "asyncio-mqtt>=0.11.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "aiofiles>=23.2.0",

    # Database
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",

    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
    "python-multipart>=0.0.6",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "pyopenssl>=23.2.0",

    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.43.0",
    "opentelemetry-instrumentation-psycopg2>=0.43.0",
    "opentelemetry-instrumentation-redis>=0.43.0",
    "opentelemetry-instrumentation-requests>=0.43.0",
    "opentelemetry-instrumentation-httpx>=0.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.22.0",
    "prometheus-client>=0.19.0",

    # Messaging
    "aio-pika>=9.3.0",
    "aiokafka>=0.9.0",

    # Caching
    "redis>=5.0.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Document Processing
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.2.0",
    "pdf2image>=1.16.0",
    "pymupdf>=1.23.0",

    # Voice
    "pyttsx3>=2.90",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",

    # LLM
    "ollama>=0.2.0",

    # Web Automation
    "playwright>=1.40.0",

    # System
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",

    # Utilities
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.18.0",
    "ipdb>=0.13.0",
]
gpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
monitoring = [
    "grafana-api>=1.0.0",
    "kubernetes>=28.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.entry-points]
console_scripts = [
    "vibe-god = python.apps.api.main:main",
    "vibe-god-worker = python.apps.worker.main:main",
    "vibe-god-scheduler = python.apps.scheduler.main:main",
    "vibe-god-setup = scripts.setup:main",
    "vibe-god-verify = scripts.verify_installation:main",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.txt", "*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "gpu: Tests requiring GPU",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

[tool.coverage.run]
source = ["python"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
# This section is for reference; actual hooks are in .pre-commit-config.yaml